<div class="stat-card">
  <div class="stat-icon">{{ icon }}</div>

  <div class="stat-body">
    <span class="stat-value">{{ value }}</span>
    <span class="stat-label">{{ label }}</span>
  </div>

  <span
    class="stat-trend"
    *ngIf="trend"
    [class.positive]="trendPositive"
    [class.negative]="!trendPositive"
  >
    {{ trend }}
  </span>
</div>
