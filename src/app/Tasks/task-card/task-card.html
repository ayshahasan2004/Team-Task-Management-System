<div class="task-card" (click)="onCardClick()">
  <div class="card-top">
    <span class="priority-dot" [class]="priorityClass"></span>
    <app-task-status-badge [status]="task.status"></app-task-status-badge>
  </div>

  <h4 class="task-title">{{ task.title }}</h4>
  <p class="task-description">{{ task.description }}</p>

  <div class="card-footer">
    <div class="assignee">
      <span class="avatar">{{ task.assigneeInitial }}</span>
      <span class="assignee-name">{{ task.assigneeName }}</span>
    </div>
    <span class="due-date">{{ task.dueDate }}</span>
  </div>
</div>
