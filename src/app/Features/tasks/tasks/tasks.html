<div class="tasks-page">

  <div class="page-header">
    <div>
      <h2>Tasks</h2>
      <span class="subtitle">{{ tasks.length }} tasks</span>
    </div>
    <button class="new-task-btn" type="button" (click)="openCreateDialog()">
      + New Task
    </button>
  </div>

  <app-task-filters (statusChanged)="onStatusFilterChanged($event)"></app-task-filters>

  <div class="tasks-grid">
    <app-task-card
      *ngFor="let task of tasks"
      [task]="task"
      (cardClicked)="onCardClicked($event)"
    ></app-task-card>
  </div>

  <app-create-task-dialog
    [isOpen]="isCreateDialogOpen"
    (closed)="closeCreateDialog()"
    (created)="onTaskCreated()"
  ></app-create-task-dialog>

</div>
