<div class="settings-page">

  <div class="page-header">
    <h2>Settings</h2>
    <span class="subtitle">Manage your account and preferences</span>
  </div>

  <div class="settings-layout">

    <div class="tabs">
      @for (tab of tabs; track tab) {
        <button
          type="button"
          class="tab"
          [class.active]="tab === activeTab"
          (click)="selectTab(tab)"
        >
          {{ tab }}
        </button>
      }
    </div>

    <div class="tab-content">
      @if (activeTab === 'Profile') {
        <app-profile-settings [user]="user()"></app-profile-settings>
      }
      @if (activeTab === 'Notifications') {
        <app-notification-settings></app-notification-settings>
      }
      @if (activeTab === 'Security') {
        <app-security-settings></app-security-settings>
      }
    </div>

  </div>

</div>
