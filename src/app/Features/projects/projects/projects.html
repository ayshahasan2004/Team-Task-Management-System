<div class="projects-page">

  <div class="page-header">
    <div>
      <h2>Projects</h2>
      <span class="subtitle">{{ projects.length }} active projects</span>
    </div>
    <button class="new-project-btn" type="button" (click)="openCreateDialog()">
      + New Project
    </button>
  </div>

  <div class="projects-grid">
    <app-project-card
      *ngFor="let project of projects"
      [project]="project"
      (cardClicked)="onCardClicked($event)"
    ></app-project-card>
  </div>

  <app-create-project-dialog
    [isOpen]="isCreateDialogOpen"
    (closed)="closeCreateDialog()"
    (created)="onProjectCreated()"
  ></app-create-project-dialog>

</div>
