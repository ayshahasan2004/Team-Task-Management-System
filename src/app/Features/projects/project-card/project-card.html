<div class="project-card">
 <div class="card-header">
    <span class="project-name">{{ project().name }}</span>
    <span class="status-badge" [class]="statusClass">{{ project().status }}</span>
 </div>

 <p class="project-description">{{ project().description }}</p>

 <div class="progress-row">
    <div
      class="progress-track"
      role="progressbar"
      [attr.aria-valuenow]="projectProgress"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-label]="project().name + ' progress'"
    >
      <div class="progress-fill" [style.width.%]="projectProgress"></div>
    </div>
    <span class="progress-value">{{ projectProgress }}%</span>
 </div>

  <div class="card-footer">
    <span class="members">◎ {{ project().memberIds.length }} members</span>
    <span class="due-date">Due {{ formatDueDate(project().dueDate) }}</span>
  </div>

  <div class="card-actions">
    <button class="details-btn" type="button" title="View project details" (click)="onViewDetails($event)">
      View details
    </button>
    <select
      class="status-select"
      [value]="project().status"
      [class.status-active]="project().status === 'Active'"
      [class.status-completed]="project().status === 'Completed'"
      [class.status-archived]="project().status === 'Archived'"
      aria-label="Change project status"
      (click)="$event.stopPropagation()"
      (change)="onStatusChange($event)"
    >
      <option value="Active">Active</option>
      <option value="Completed">Completed</option>
      <option value="Archived">Archived</option>
    </select>
    <button class="icon-btn" type="button" [attr.aria-label]="'Edit ' + project().name" (click)="onEdit($event)">Edit</button>
    <button class="icon-btn delete-btn" type="button" [attr.aria-label]="'Delete ' + project().name" (click)="onDelete($event)">Delete</button>
  </div>
</div>
