@if (isOpen()) {
  <div class="overlay" (click)="onClose()">
    <div class="dialog" [style.max-width]="maxWidth()" (click)="$event.stopPropagation()">

      @if (title()) {
        <div class="dialog-header">
          <h3>{{ title() }}</h3>
          <button class="close-btn" type="button" (click)="onClose()">✕</button>
        </div>
      }

      <div class="dialog-body">
        <ng-content></ng-content>
      </div>

    </div>
  </div>
}
