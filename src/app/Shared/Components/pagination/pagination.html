<div class="pagination">
  <button
    class="nav-btn"
    type="button"
    [disabled]="currentPage() === 1"
    (click)="prev()"
  >
    ‹
  </button>

  @for (page of pages; track page) {
    <button
      type="button"
      class="page-btn"
      [class.active]="page === currentPage()"
      (click)="goTo(page)"
    >
      {{ page }}
    </button>
  }

  <button
    class="nav-btn"
    type="button"
    [disabled]="currentPage() === totalPages()"
    (click)="next()"
  >
    ›
  </button>
</div>
