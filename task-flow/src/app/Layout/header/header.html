<header class="header">
  <div class="header-title">
    <span class="page-title">{{ pageTitle() }}</span>
  </div>

  <div class="header-actions">
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="M20 20l-3.5-3.5" />
      </svg>
      <input
        type="search"
        placeholder="Search projects, tasks, people"
        aria-label="Search projects, tasks, people"
        autocomplete="off"
        [value]="searchQuery()"
        [attr.aria-expanded]="showSearchResults()"
        [attr.aria-controls]="showSearchResults() ? 'global-search-results' : null"
        (input)="onSearchInput($event)"
        (focus)="isSearchFocused.set(true)"
        (blur)="isSearchFocused.set(false)"
        (keydown)="onSearchKeydown($event)"
      />
      @if (showSearchResults()) {
        <div id="global-search-results" class="search-results" role="listbox" aria-label="Search results">
          @for (result of searchResults(); track result.type + result.id) {
            <button
              class="search-result"
              type="button"
              role="option"
              (mousedown)="$event.preventDefault()"
              (click)="openSearchResult(result)"
            >
              <span class="search-result-type">{{ result.type }}</span>
              <span class="search-result-content">
                <span class="search-result-title">{{ result.title }}</span>
                <span class="search-result-detail">{{ result.detail }}</span>
              </span>
            </button>
          } @empty {
            <div class="search-empty" role="status">No matching projects, tasks, or people.</div>
          }
        </div>
      }
    </div>

    <button class="icon-button" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.7 21a2 2 0 0 1-3.4 0" />
      </svg>
      <span class="badge">3</span>
    </button>

    <button
      class="theme-button"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.aria-pressed]="theme() === 'dark'"
      [attr.title]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" />
        </svg>
      }
    </button>

    <span class="actions-divider" aria-hidden="true"></span>

    <button
      class="user-button"
      type="button"
      aria-haspopup="menu"
      [attr.aria-expanded]="isUserMenuOpen"
      aria-label="Account menu"
      (click)="toggleUserMenu()"
    >
      <span class="avatar">{{ user().avatarInitial }}</span>
      <span class="user-meta">
        <span class="user-name">{{ user().name }}</span>
        <span class="user-role">Member</span>
      </span>
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </button>

    <app-user-menu
      [user]="user()"
      [isOpen]="isUserMenuOpen"
      (logoutClicked)="onLogout()"
    ></app-user-menu>
  </div>
</header>
