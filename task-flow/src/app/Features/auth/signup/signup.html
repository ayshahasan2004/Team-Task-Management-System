<div class="auth-wrap">
  <div class="card">
    <h2>Create account</h2>

    <div class="field">
      <label for="su-email">Email</label>
      <input type="email" id="su-email" placeholder="you@example.com" />
    </div>

    <div class="field">
      <label for="su-password">Password</label>
      <input type="password" id="su-password" placeholder="Create a password" />
    </div>

    <button class="btn-primary" type="button">Sign up</button>

    <div class="divider">OR</div>

    <div class="socials">
      <a href="#" aria-label="Continue with Google">G</a>
      <a href="#" aria-label="Continue with Facebook">f</a>
      <a href="#" aria-label="Continue with LinkedIn">in</a>
    </div>

    <p class="switch">Already a user?<a routerLink="/login">Log in</a></p>
  </div>
</div>
