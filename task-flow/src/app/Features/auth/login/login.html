<div class="auth-wrap">
  <div class="card">
    <h2>Welcome back</h2>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <div class="field">
      <label for="li-email">Email</label>
      <input type="email" id="li-email" placeholder="you@example.com" [(ngModel)]="email" />
    </div>

    <div class="field">
      <label for="li-password">Password</label>
      <input type="password" id="li-password" placeholder="Enter your password" [(ngModel)]="password" />
    </div>

    <button class="btn-primary" type="button" [disabled]="loading()" (click)="onSubmit()">
      {{ loading() ? 'Logging in...' : 'Log in' }}
    </button>

    <p class="switch">Need an account?<a routerLink="/signup">Sign up</a></p>
  </div>
</div>
