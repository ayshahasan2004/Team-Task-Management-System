<div class="auth-wrap">
  <div class="card">
    <h2>Welcome back</h2>

    <div class="field">
      <label for="li-email">Email</label>
      <input type="email" id="li-email" placeholder="you@example.com" />
    </div>

    <div class="field">
      <label for="li-password">Password</label>
      <input type="password" id="li-password" placeholder="Enter your password" />
    </div>

    <label class="remember">
      <input type="checkbox" checked />
      Remember me
    </label>

    <button class="btn-primary" type="button">Log in</button>
    <a href="#" class="forgot">Forgot password?</a>

    <div class="divider">OR</div>

    <div class="socials">
      <a href="#" aria-label="Continue with Google">G</a>
      <a href="#" aria-label="Continue with Facebook">f</a>
      <a href="#" aria-label="Continue with LinkedIn">in</a>
    </div>

    <p class="switch">Need an account?<a routerLink="/signup">Sign up</a></p>
  </div>
</div>
