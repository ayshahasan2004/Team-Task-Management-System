<div class="kanban-board-page">

  <div class="page-header">
    <h2>Kanban Board</h2>
    <span class="subtitle">{{ todoTasks().length + inProgressTasks().length + reviewTasks().length + doneTasks().length }} tasks total</span>
  </div>

  <div class="board">
    <app-kanban-column
      [title]="'Todo'"
      [status]="'TODO'"
      accentColor="#98a19c"
      [tasks]="todoTasks()"
      (taskClicked)="onTaskClicked($event)"
      (taskDropped)="onTaskDropped($event)"
    ></app-kanban-column>

    <app-kanban-column
      [title]="'In Progress'"
      [status]="'IN_PROGRESS'"
      accentColor="#48b4ff"
      [tasks]="inProgressTasks()"
      (taskClicked)="onTaskClicked($event)"
      (taskDropped)="onTaskDropped($event)"
    ></app-kanban-column>

    <app-kanban-column
      [title]="'Review'"
      [status]="'REVIEW'"
      accentColor="#f5a623"
      [tasks]="reviewTasks()"
      (taskClicked)="onTaskClicked($event)"
      (taskDropped)="onTaskDropped($event)"
    ></app-kanban-column>

    <app-kanban-column
      [title]="'Done'"
      [status]="'DONE'"
      accentColor="#0052cc"
      [tasks]="doneTasks()"
      (taskClicked)="onTaskClicked($event)"
      (taskDropped)="onTaskDropped($event)"
    ></app-kanban-column>
  </div>

</div>
