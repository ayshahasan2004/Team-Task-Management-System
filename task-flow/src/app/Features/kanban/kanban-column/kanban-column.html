<div
  class="kanban-column"
  [class.drag-over]="dragOver()"
  [style.--column-accent]="accentColor()"
>
  <div class="column-header">
    <span class="dot" [style.background]="accentColor()"></span>
    <span class="column-title">{{ title() }}</span>
    <span class="task-count">{{ tasks().length }}</span>
  </div>

  <!-- Phase 7: CDK drop list — this column is a drop target for kanban cards.
       All four columns are connected to each other so cards can move between them. -->
  <div
    class="column-body"
    cdkDropList
    [cdkDropListData]="tasks()"
    [cdkDropListConnectedTo]="connectedIds()"
    [id]="status()"
    (cdkDropListEntered)="onDragEnter()"
    (cdkDropListExited)="onDragLeave()"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (task of tasks(); track task.id) {
      <app-kanban-task
        cdkDrag
        [cdkDragData]="task.id"
        [task]="task"
        (cardClicked)="onTaskClick($event)"
      ></app-kanban-task>
    }

    @if (tasks().length === 0) {
      <div class="empty-state">
        No tasks
      </div>
    }
  </div>
</div>
