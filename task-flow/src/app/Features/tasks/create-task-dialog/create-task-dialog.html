@if (isOpen()) {
  <div class="dialog-overlay" (click)="cancel()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="new-task-title" (click)="$event.stopPropagation()">
      <div class="dialog-header">
        <h3 id="new-task-title">New Task</h3>
        <button type="button" class="close-btn" aria-label="Close" (click)="cancel()">×</button>
      </div>

      <div class="field-group">
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field">
          <span>Project</span>
          <select formControlName="projectId" [disabled]="isCreating"
            [class.invalid-input]="showError(projectId)">
            <option value="">Choose a project</option>
            @for (project of projects(); track project.id) {
              <option [value]="project.id">{{ project.name }}</option>
            }
          </select>
          @if (showError(projectId)) {
            <span class="field-error">Choose a project for this task.</span>
          }
        </label>

        <label class="field">
          <span>Task title</span>
          <input formControlName="title" placeholder="Task title" [disabled]="isCreating"
            [class.invalid-input]="showError(title)" />
          @if (showError(title)) {
            <span class="field-error">
              @if (title.errors?.['required']) { Task title is required. }
              @else if (title.errors?.['minlength']) { Title must be at least 3 characters. }
              @else if (title.errors?.['maxlength']) { Title must be 100 characters or fewer. }
            </span>
          }
        </label>

        <label class="field">
          <span>Description</span>
          <textarea formControlName="description" rows="4" placeholder="Description"
            [class.invalid-input]="showError(description)"></textarea>
          @if (showError(description)) {
            <span class="field-error">Description must be 500 characters or fewer.</span>
          }
        </label>

        <div class="field-row">
          <label class="field half">
            <span>Status</span>
            <select formControlName="status">
              <option value="Todo">Todo</option>
              <option value="In Progress">In Progress</option>
              <option value="Review">Review</option>
              <option value="Done">Done</option>
            </select>
          </label>

          <label class="field half">
            <span>Priority</span>
            <select formControlName="priority">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Due date</span>
          <input type="date" formControlName="dueDate" />
        </label>
        </form>
      </div>

      @if (saveError) {
        <p class="form-error" role="alert">{{ saveError }}</p>
      }

      <div class="dialog-actions">
        <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="isCreating">Cancel</button>
        <button type="button" class="btn-primary" (click)="submit()" [disabled]="isCreating">
          {{ isCreating ? 'Creating...' : 'Create' }}
        </button>
      </div>
    </div>
  </div>
}
